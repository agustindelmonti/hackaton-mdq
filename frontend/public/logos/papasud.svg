<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" role="img" aria-label="Papasud S.A.">
  <title>Papasud S.A.</title>
  <!--
    Reconstrucción vectorial del sello de Papasud. El original llegó en JPEG con
    el damero de transparencia quemado en los píxeles; rehacerlo como SVG lo deja
    limpio, escala a cualquier tamaño y no arrastra fondo.
    Azul marino #1E2F6F sobre crema #F2EDE4, la misma pareja del sello impreso.
  -->
  <defs>
    <style>
      .marino { fill: #1e2f6f; }
      .crema  { fill: #f2ede4; }
      .trazo  { fill: none; stroke: #1e2f6f; }
      .texto  {
        fill: #f2ede4;
        font-family: "Playfair Display", "Georgia", "Times New Roman", serif;
        font-weight: 700;
        font-size: 116px;
        letter-spacing: 6px;
      }
    </style>
  </defs>

  <!-- el óvalo de atrás, en dos trazos como el sello original -->
  <ellipse class="trazo" cx="512" cy="170" rx="222" ry="152" stroke-width="17"/>
  <ellipse class="trazo" cx="512" cy="170" rx="196" ry="128" stroke-width="7"/>

  <!-- la píldora: contorno, aro crema y campo marino -->
  <rect class="marino" x="18"  y="52"  width="988" height="236" rx="118"/>
  <rect class="crema"  x="30"  y="64"  width="964" height="212" rx="106"/>
  <rect class="marino" x="43"  y="77"  width="938" height="186" rx="93"/>

  <text class="texto" x="512" y="212" text-anchor="middle">PAPASUD  S.A.</text>
</svg>
